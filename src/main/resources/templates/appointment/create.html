<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="hu">
<head>
  <meta charset="UTF-8">
  <title>Új Időpont Létrehozása</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootswatch@4.3.1/dist/flatly/bootstrap.min.css">
</head>
<body class="container d-flex flex-column justify-content-center align-items-center vh-100">

<div class="card p-4 shadow-lg" style="max-width: 500px; width: 100%">
  <h1 class="h3 text-center mb-4">Új Időpont</h1>

  <form th:action="@{/appointment/create}" method="post">
    <div class="form-group mb-3">
      <label for="doctorId" class="font-weight-bold">Orvos ID</label>
      <input type="number" class="form-control" id="doctorId" name="doctorId" required placeholder="Adja meg az orvos ID-ját">
    </div>

    <div class="form-group mb-4">
      <label for="dateTime" class="font-weight-bold">Időpont kiválasztása</label>
      <input type="datetime-local" class="form-control" id="dateTime" name="dateTime" required>
    </div>

    <button type="submit" class="btn btn-primary btn-block">Létrehozás</button>
  </form>
</div>

</body>
</html>
